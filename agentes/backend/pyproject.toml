[project]
name = "kroomix-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.189",
    "fastapi>=0.165.0",
    "pdfplumber>=0.11.11",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pypdfium2>=5.15.2",
    "reportlab>=5.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["eval: evaluaciones con el agente real (lentas, consumen cuota)"]
addopts = "-m 'not eval'"
